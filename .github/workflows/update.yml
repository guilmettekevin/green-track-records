name: Update website

on:
  schedule:
    - cron: "17 8 * * *"   # every night, about 4am Eastern
  workflow_dispatch:        # "Run workflow" button, and the sheet's "Publish website now"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull the latest from the Google Sheet
        run: python scripts/fetch_sheet.py

      - name: Build the website data
        run: |
          python scripts/build_team_scores.py
          python scripts/build_data.py
          python scripts/build_fields.py

      - name: Save a dated copy of the data in the repo history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Data update $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
